# Local test servers for integration tests (Phase 1+). Requires Docker Desktop.
#   docker compose -f docker-compose.test.yml up -d
services:
  greenmail:            # IMAP 3143/3993, SMTP 3025/3465; any user/password is accepted and auto-created
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    ports: ["3025:3025", "3143:3143", "3465:3465", "3993:3993"]

  radicale:             # CalDAV/CardDAV on http://localhost:5232
    image: tomsquest/docker-radicale:3.2.3.1
    ports: ["5232:5232"]
